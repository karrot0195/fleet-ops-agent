apiVersion: agent-skills/v1
kind: Project
name: upgrade-VM
summary: Automation project for auditing and upgrading nginx on a fleet of DigitalOcean
  VMs. VM IPs are collected via doctl into ip.txt (already populated); each VM is
  checked for nginx presence, version, and configuration drift, producing a per-VM
  plan under plan/{ip}.md. Plans are summarized for user confirmation, then executed
  with local config backups for rollback, processing VMs in parallel behind confirmation
  gates. The agent-skills submodule provides the agent workflow tooling.
architecture:
  framework: ''
  language: Python 3.11+
  database: ''
  unit_test_framework: unittest
skills:
- name: verify-audit
  description: python3 -m unittest discover -s .agents/skills/nginx-fleet-upgrade/scripts/tests
    -t .agents/skills/nginx-fleet-upgrade/scripts -k verdict -k survey -k inventory
    -k audit_flow
- name: verify-rollout
  description: python3 -m unittest discover -s .agents/skills/nginx-fleet-upgrade/scripts/tests
    -t .agents/skills/nginx-fleet-upgrade/scripts -k execute -k rollout
- name: verify-rollback
  description: python3 -m unittest discover -s .agents/skills/nginx-fleet-upgrade/scripts/tests
    -t .agents/skills/nginx-fleet-upgrade/scripts -k rollback
- name: verify-report
  description: python3 -m unittest discover -s .agents/skills/nginx-fleet-upgrade/scripts/tests
    -t .agents/skills/nginx-fleet-upgrade/scripts -k report
rules: []
features_file: .specific/project-features.yaml
